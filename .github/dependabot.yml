version: 2

updates:
  # NuGet. Versions live in Directory.Packages.props (central package management), which Dependabot
  # understands — a bump lands in that one file rather than in each csproj.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - work:platform
      - "Work Estimate: 1"
    commit-message:
      prefix: build
      include: scope
    groups:
      # The Microsoft.Extensions.* packages move together; separate PRs for each would produce the version
      # split this repo just finished resolving.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-stack:
        patterns:
          - "xunit*"
          - "FakeItEasy"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      # LICENSE CAP: FluentAssertions v8+ is commercially licensed. Do not let a bot walk into that.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
      # TARGET CAP: the library targets net8.0;net10.0 and stays on the 10.x LTS package line (ADR-0005,
      # gh#123). The .NET 11 majors ship no net8.0 build (SignalR.Client 11 ships no net10.0 build either), so
      # they hang the net8.0 test host and push 11.x onto net10.0 consumers. Minor and patch updates still
      # flow. Lift this only together with dropping net8.0, which is a major release.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.SignalR.Client"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 3
    target-branch: develop
    labels:
      - work:platform
      - "Work Estimate: 1"
    commit-message:
      prefix: ci
      include: scope
