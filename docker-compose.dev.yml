# Toolchain override: run the build, tests and formatter inside a pinned SDK container.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --build sdk dotnet test
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --build sdk dotnet format --verify-no-changes
#
# --build matters: the sdk image is built locally from the dockerfile_inline below, and without it a change to
# that Dockerfile is silently not applied to an image already built.
#
# Two reasons this exists.
#
# A local check that disagrees with CI is worse than no local check. CI runs on ubuntu-latest with LF line
# endings and a pinned SDK; this reproduces that exactly, so `dotnet format` cannot pass here and fail there.
#
# And on Windows, Smart App Control intermittently blocks freshly built unsigned assemblies (0x800711C7),
# which fails a local build for reasons that have nothing to do with the code. Building in the container
# sidesteps it entirely.

services:
  sdk:
    # The 10.0 SDK builds both target frameworks but carries only the 10.0 runtimes. The net8.0 legs of both test
    # tiers need Microsoft.NETCore.App and Microsoft.AspNetCore.App 8.x as well, so they are layered in from the
    # official runtime image rather than fetched by a script (ADR-0005, gh#67).
    image: projectx-sdk-dev:10.0
    build:
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS runtime8
        FROM mcr.microsoft.com/dotnet/sdk:10.0
        COPY --from=runtime8 /usr/share/dotnet/shared /usr/share/dotnet/shared
    working_dir: /repo
    volumes:
      - .:/repo
      # A named volume, not a bind mount: NuGet's cache is full of small files and a bind mount across the
      # Windows filesystem boundary makes restore crawl.
      - nuget-cache:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # The integration suite defaults to hosting the gateway in-process. Point it at the composed one instead
      # when both services are up.
      PROJECTX_FAKE_GATEWAY_URL: "${PROJECTX_FAKE_GATEWAY_URL:-}"
    # Overridden by whatever follows `run --rm sdk`.
    entrypoint: ["dotnet"]
    command: ["--info"]

volumes:
  nuget-cache:
